# render.yaml — Render.com deployment for GridPulse FastAPI backend

services:
  - type: web
    name: gridpulse-api
    runtime: python
    region: singapore
    plan: free
    rootDir: src
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11.9"
    healthCheckPath: /api/health
