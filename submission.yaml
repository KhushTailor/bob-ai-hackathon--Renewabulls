submission:
  title: "GridPulse"                     # REQUIRED

  problem_statement: >                   # REQUIRED
    Grid operators managing renewable-heavy microgrids face acute cognitive overload:
    demand is volatile, solar and wind output is intermittent, and anomalies such as
    frequency deviations require immediate action. Existing SCADA and EMS tools present
    raw telemetry but do not synthesise it into actionable recommendations, forcing
    operators to manually correlate data across multiple screens under time pressure.

  solution_summary: >                    # REQUIRED
    GridPulse is an AI-assisted grid optimisation dashboard combining IBM Granite
    time-series demand forecasting, rule-based anomaly detection, and deterministic
    what-if simulation. A natural-language AI Operator Brief generated by IBM Granite
    gives operators a single decision-ready view answering what is happening, why,
    the risk level, and the recommended balancing action.

  key_features:                          # REQUIRED — 3 to 5 specific implemented features
    - "72-hour demand forecasting using IBM Granite time-series models (zero-shot, 288 points at 15-min intervals)"
    - "Renewable performance monitoring with solar/wind performance ratios, capacity factors, and curtailment detection"
    - "12-rule anomaly and red-flag engine with CRITICAL/WARNING/INFO severity classification"
    - "72-hour what-if simulation scoring balancing actions across feasibility, grid relief, battery SOC, and risk"
    - "AI Operator Brief answering six decision-critical questions with deterministic fallback support"

  tech_stack:
    languages: ["Python", "JavaScript", "TypeScript"]
    frameworks: ["FastAPI", "React 18"]
    ibm_technologies:
      - "IBM Bob (AI-assisted development environment and MCP runtime tool interface)"
      - "watsonx.ai IBM Granite TTM time-series models (ibm/granite-ttm-512-96-r2)"
      - "watsonx.ai IBM Granite Instruct model (ibm/granite-3-3-8b-instruct)"
    databases: []
    other: ["Pandas", "NumPy", "statsmodels", "Recharts", "Jinja2", "Vite", "pytest", "@modelcontextprotocol/sdk"]

  what_we_are_most_proud_of: >
    The combination of deterministic, physics-bounded grid balancing models with a real
    Model Context Protocol (MCP) server that exposes six decision-support tools directly
    to AI assistants like IBM Bob and Antigravity. The system provides decision-support
    clarity without making dangerous unverified autonomous grid control claims.

  known_limitations: >
    GridPulse is designed as a decision-support prototype, and we have clearly defined its current scope:
    Decision Support, Not Direct Control
    Provides alerts and recommendations for operators; it does not directly control high-voltage equipment.
    Synthetic Data
    The prototype uses a 6-month synthetic dataset representing solar, wind, demand, and grid events.
    Focused Power Model
    Currently focuses on active power balance, capacity, and battery SOC, without detailed reactive-power or transmission-line modelling.
    Cloud AI Dependency
    watsonx.ai features require IBM Cloud access. If unavailable, the system uses built-in statistical and rule-based methods to keep the prototype functional.

